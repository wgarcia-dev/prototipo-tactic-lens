title: Posible acceso a clave privada
id: 896d3972-1d45-5197-9b50-98189a2bdb76
name: private_key
status: experimental
description: Observed honeypot activity; does not establish successful execution or
  compromise.
author: TacticLens
logsource:
  product: cowrie
detection:
  selection:
    eventid: cowrie.command.input
    input|contains:
    - /.ssh/id_rsa
    - /.ssh/id_ed25519
  condition: selection
falsepositives:
- Authorized laboratory activity; administrative commands; quoted text.
level: high
tags:
- attack.t1552.004
