title: Intento de acceso a archivos sensibles
id: 697ec22e-417f-57db-aefb-12e5c9b4d275
name: sensitive_files
status: experimental
description: Observed honeypot activity; does not establish successful execution or
  compromise.
author: TacticLens
logsource:
  product: cowrie
detection:
  selection:
    eventid: cowrie.command.input
    input|contains:
    - /etc/shadow
    - /etc/gshadow
  condition: selection
falsepositives:
- Authorized laboratory activity; administrative commands; quoted text.
level: high
tags:
- attack.t1003.008
