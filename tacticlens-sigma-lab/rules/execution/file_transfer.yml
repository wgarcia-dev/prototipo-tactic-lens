title: Intento de transferencia de archivos
id: b2ccf2c3-cfe9-5403-856c-db24d5de9722
name: file_transfer
status: experimental
description: Observed honeypot activity; does not establish successful execution or
  compromise.
author: TacticLens
logsource:
  product: cowrie
detection:
  selection:
    eventid: cowrie.command.input
    input|re: (^|[;|&]\s*|\s)(wget|curl|scp|sftp)\s
  condition: selection
falsepositives:
- Authorized laboratory activity; administrative commands; quoted text.
level: high
tags:
- attack.t1105
