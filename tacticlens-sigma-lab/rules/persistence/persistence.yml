title: Intento de persistencia mediante claves SSH
id: 7f4c911e-3c93-50d9-a295-58b1c5f29d4e
name: persistence
status: experimental
description: Observed honeypot activity; does not establish successful execution or
  compromise.
author: TacticLens
logsource:
  product: cowrie
detection:
  selection:
    eventid: cowrie.command.input
    input|re: '>>?\s*[^;]*authorized_keys'
  condition: selection
falsepositives:
- Authorized laboratory activity; administrative commands; quoted text.
level: high
tags:
- attack.t1098.004
